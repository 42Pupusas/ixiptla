[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cuarentaydos"]
repository = "https://github.com/42Pupusas/ixiptla"
rust-version = "1.85"

[workspace.dependencies]
ixchel = { path = "../ixchel" }
ixiptla-core = { path = "crates/ixiptla-core", version = "0.1.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
