[package]
name = "ixiptla-conformance"
description = "Differential testing of ixiptla-core against the battle-tested `png` crate: same bytes in, same RGBA8 pixels out."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `png` (not `ixiptla-core`, which stays dev-only below) is a real
# dependency here: `src/reference_decoder.rs` is compiled unconditionally
# (not `#[cfg(test)]`) so both this crate's own unit tests *and* the
# `tests/pngsuite.rs` integration test binary -- which links the compiled
# lib without its `#[cfg(test)]` code -- can reach it.
ixiptla-core.workspace = true
png = "0.18"

[dev-dependencies]
flate2 = "1"
crc32fast = "1"
