[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cuarentaydos"]
repository = "https://github.com/42Pupusas/ixiptla"
# 1.89 (not 1.85) because `ixiptla-core`'s `crc32_vpclmulqdq` module uses
# `_mm256_clmulepi64_epi128` (VPCLMULQDQ's 256-bit carry-less multiply),
# stabilized in that release -- see that module's doc comment for why the
# wider fold is worth the bump.
rust-version = "1.89"

[workspace.dependencies]
ixchel = { path = "../ixchel" }
ixiptla-core = { path = "crates/ixiptla-core", version = "0.1.0" }
quetzalcoatl = { path = "../quetzalcoatl", version = "0.13" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Same codegen as [profile.release] (so `perf` sees the exact same
# optimized machine code, not a debug build with a totally different
# hot-loop shape) but keeping symbols and line-table debug info instead
# of stripping them -- `cargo/perf` tool's `record` target builds with
# this profile so `perf report`'s call graph shows real function names
# (and, with a DWARF-aware `perf`, source lines) instead of bare hex
# offsets like `[.] 0x0000000000032cc6`.
[profile.profiling]
inherits = "release"
strip = false
debug = true
